<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tung Tung Fart Attack</title>
<style>
  html,body{margin:0;height:100%;background:#1b1f2a;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  text{paint-order:stroke;stroke-linejoin:round}
  .shake{transform-box:fill-box}
  svg{width:min(100vw,900px);height:auto;touch-action:manipulation;cursor:pointer}
  #hud{position:absolute;top:12px;left:0;right:0;text-align:center;color:#ffd84a;font-size:28px;letter-spacing:1px;text-shadow:3px 3px 0 #000}
  #hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#9aa3b5;font-family:Arial,sans-serif;font-size:15px}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
</style>
</head>
<body>
<div id="hud">FARTS: <span id="n">0</span> &nbsp; CAT RAGE: <span id="rage">0</span>%</div>
<div id="stage">
<svg id="svg" viewBox="0 0 900 500">
  <!-- floor -->
  <rect x="0" y="400" width="900" height="100" fill="#3a2f28"/>
  <rect x="0" y="400" width="900" height="6" fill="#57463a"/>

  <!-- TUNG TUNG (wooden log guy) -->
  <g transform="translate(230,0)"><g id="tungShake"><g id="tung">
    <!-- legs -->
    <rect x="-28" y="330" width="14" height="70" rx="6" fill="#7a4e2a"/>
    <rect x="14" y="330" width="14" height="70" rx="6" fill="#7a4e2a"/>
    <ellipse cx="-24" cy="400" rx="18" ry="7" fill="#4a2e18"/>
    <ellipse cx="24" cy="400" rx="18" ry="7" fill="#4a2e18"/>
    <!-- log body -->
    <rect x="-55" y="110" width="110" height="230" rx="40" fill="#b07a45"/>
    <path d="M-40 150 q10 60 0 160 M-15 130 q8 90 0 190 M15 140 q-8 80 0 180 M38 160 q-8 60 0 150" stroke="#8a5a2f" stroke-width="4" fill="none"/>
    <ellipse cx="0" cy="118" rx="52" ry="14" fill="#d9a96c"/>
    <ellipse cx="0" cy="118" rx="30" ry="8" fill="none" stroke="#b07a45" stroke-width="3"/>
    <!-- face -->
    <ellipse cx="-20" cy="175" rx="15" ry="18" fill="#fff"/>
    <ellipse cx="22" cy="175" rx="15" ry="18" fill="#fff"/>
    <circle id="pl" cx="-17" cy="178" r="7" fill="#111"/>
    <circle id="pr" cx="25" cy="178" r="7" fill="#111"/>
    <path d="M-38 150 l28 8 M38 150 l-28 8" stroke="#3b2414" stroke-width="6" stroke-linecap="round"/>
    <path id="mouth" d="M-22 225 q22 18 44 0" stroke="#3b2414" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- arm + bat -->
    <g id="arm">
      <rect x="45" y="200" width="60" height="13" rx="6" fill="#7a4e2a"/>
      <g transform="translate(108,206) rotate(-60)">
        <rect x="-6" y="-10" width="14" height="20" rx="4" fill="#3b2414"/>
        <path d="M8 -6 L120 -14 Q135 0 120 14 L8 6 Z" fill="#e4c48a" stroke="#a9874e" stroke-width="3"/>
      </g>
    </g>
    <rect x="-105" y="200" width="55" height="13" rx="6" fill="#7a4e2a"/>
  </g></g></g>

  <!-- CAT -->
  <g id="cat" transform="translate(620,0)"><g id="catShake">
    <g id="catbody">
      <path id="tail" d="M70 360 q60 -20 40 -90" stroke="#f08b2e" stroke-width="16" fill="none" stroke-linecap="round"/>
      <ellipse cx="20" cy="355" rx="75" ry="45" fill="#f08b2e"/>
      <path d="M-20 330 q10 30 0 55 M15 318 q10 35 0 75 M50 325 q8 30 0 60" stroke="#c96a18" stroke-width="7" fill="none"/>
      <rect x="-40" y="380" width="18" height="22" rx="8" fill="#f08b2e"/>
      <rect x="50" y="380" width="18" height="22" rx="8" fill="#f08b2e"/>
      <!-- head -->
      <circle cx="-55" cy="300" r="48" fill="#f08b2e"/>
      <path d="M-95 275 l-8 -52 l38 26 Z" fill="#f08b2e"/>
      <path d="M-30 268 l20 -48 l12 46 Z" fill="#f08b2e"/>
      <path d="M-91 270 l-4 -30 l20 15 Z" fill="#ffb3c1"/>
      <path d="M-25 266 l12 -28 l6 27 Z" fill="#ffb3c1"/>
      <g id="eyesNormal">
        <ellipse cx="-75" cy="295" rx="9" ry="13" fill="#9fe36a"/>
        <ellipse cx="-38" cy="295" rx="9" ry="13" fill="#9fe36a"/>
        <ellipse cx="-75" cy="296" rx="3" ry="10" fill="#111"/>
        <ellipse cx="-38" cy="296" rx="3" ry="10" fill="#111"/>
      </g>
      <g id="eyesGross" style="display:none">
        <path d="M-85 288 l18 12 M-85 300 l18 -12 M-48 288 l18 12 M-48 300 l18 -12" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path d="M-60 312 l6 6 l6 -6 Z" fill="#ff7a9a"/>
      <path id="catMouth" d="M-66 324 q6 6 12 0 q6 6 12 0" stroke="#5a2a0a" stroke-width="3" fill="none"/>
      <path d="M-90 315 h-30 M-90 322 h-28 M-25 315 h30 M-25 322 h28" stroke="#fff" stroke-width="2"/>
    </g>
  </g></g>

  <g id="clouds"></g>
  <g id="texts"></g>
</svg>
</div>
<div id="hint">Tap / click / press SPACE to make Tung Tung fart on the cat</div>

<script>
const svg=document.getElementById('svg'), clouds=document.getElementById('clouds'), texts=document.getElementById('texts');
const NS='http://www.w3.org/2000/svg';
let farts=0, rage=0, busy=false;
const WORDS=['PFFFT','BRAAAP','TUNG TUNG PRRRT','FRRRT','POOT','BRRRRAP','SAHUUUR'];

// little fart sound made in the browser (no files)
let ac;
function fartSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime, dur=0.35+Math.random()*0.5;
    const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
    o.type='sawtooth';
    o.frequency.setValueAtTime(70+Math.random()*40,t);
    o.frequency.exponentialRampToValueAtTime(35+Math.random()*20,t+dur);
    const lfo=ac.createOscillator(), lg=ac.createGain();
    lfo.frequency.value=18+Math.random()*20; lg.gain.value=25;
    lfo.connect(lg); lg.connect(o.frequency);
    f.type='lowpass'; f.frequency.value=600;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); lfo.start(t); o.stop(t+dur); lfo.stop(t+dur);
  }catch(e){}
}

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}

function puff(){
  // green clouds from Tung's back side, drifting right toward the cat
  for(let i=0;i<9;i++){
    const c=el('circle',{cx:290,cy:330,r:10,fill:i%2?'#8fd14f':'#b7e36b',opacity:.85},clouds);
    const vx=4+Math.random()*4, vy=(Math.random()-.6)*2.2, grow=0.9+Math.random()*0.8;
    let x=290, y=330+(Math.random()*20-10), r=10, life=0, delay=i*4;
    c.setAttribute('cx',x);
    (function step(){
      if(delay>0){delay--;requestAnimationFrame(step);return;}
      life++; x+=vx; y+=vy; r+=grow;
      c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
      c.setAttribute('opacity',Math.max(0,.85-life/90));
      if(life<90) requestAnimationFrame(step); else c.remove();
    })();
  }
}

function popText(){
  const t=el('text',{x:330,y:260,fill:'#ffd84a',stroke:'#000','stroke-width':3,'font-size':40,'text-anchor':'middle'},texts);
  t.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
  let life=0;
  (function step(){life++;t.setAttribute('y',260-life*1.2);t.setAttribute('opacity',Math.max(0,1-life/70));
    if(life<70)requestAnimationFrame(step);else t.remove();})();
}

function catReact(){
  const cat=document.getElementById('catbody');
  document.getElementById('eyesNormal').style.display='none';
  document.getElementById('eyesGross').style.display='';
  document.getElementById('catMouth').setAttribute('d','M-70 330 q12 -14 24 0 Z');
  const say=el('text',{x:560,y:220,fill:'#fff',stroke:'#000','stroke-width':3,'font-size':34,'text-anchor':'middle'},texts);
  say.textContent=rage>=100?'THAT IS IT':(['HSSSS','EWWW','MREOWWW?!','BRO WHY'][Math.floor(Math.random()*4)]);
  document.getElementById('catShake').classList.add('shake');
  let jump=0;
  (function step(){
    jump++;
    const h=Math.sin(jump/30*Math.PI)*60;
    cat.setAttribute('transform',`translate(0,${-h})`);
    if(jump<30)requestAnimationFrame(step);
    else{
      cat.setAttribute('transform','');
      document.getElementById('catShake').classList.remove('shake');
      setTimeout(()=>{say.remove();
        document.getElementById('eyesNormal').style.display='';
        document.getElementById('eyesGross').style.display='none';
        document.getElementById('catMouth').setAttribute('d','M-66 324 q6 6 12 0 q6 6 12 0');
        if(rage>=100) revenge(); else busy=false;
      },500);
    }
  })();
}

function revenge(){
  // cat gets mad and bonks Tung back, then resets
  const cat=document.getElementById('cat');
  let f=0;
  (function step(){
    f++;
    const x = f<25 ? 620-f*12 : 620-25*12+(f-25)*12;
    cat.setAttribute('transform',`translate(${x},0)`);
    if(f===25){
      document.getElementById('tungShake').classList.add('shake');
      const b=el('text',{x:230,y:90,fill:'#ff5050',stroke:'#000','stroke-width':3,'font-size':48,'text-anchor':'middle'},texts);
      b.textContent='SCRATCH!';
      setTimeout(()=>{b.remove();document.getElementById('tungShake').classList.remove('shake');},900);
    }
    if(f<50)requestAnimationFrame(step);
    else{cat.setAttribute('transform','translate(620,0)');rage=0;document.getElementById('rage').textContent=0;busy=false;}
  })();
}

function fart(){
  if(busy)return; busy=true;
  farts++; rage=Math.min(100,rage+20);
  document.getElementById('n').textContent=farts;
  document.getElementById('rage').textContent=rage;
  // Tung squints + leans
  const tung=document.getElementById('tung');
  tung.setAttribute('transform','rotate(-6 0 400)');
  document.getElementById('mouth').setAttribute('d','M-22 230 q22 -14 44 0');
  setTimeout(()=>{tung.setAttribute('transform','');
    document.getElementById('mouth').setAttribute('d','M-22 225 q22 18 44 0');},400);
  fartSound(); puff(); popText();
  setTimeout(catReact,450);
}

svg.addEventListener('pointerdown',fart);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fart();}});
</script>
</body>
</html>
